<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock de Aceites — Ecominera</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f2f5;
  --bg2: #ffffff;
  --bg3: #f5f7fa;
  --border: #e0e4eb;
  --border2: #c8cfd9;
  --text: #1a2030;
  --text2: #5a6478;
  --text3: #9aa3b2;
  --accent: #1a6fd4;
  --accent2: #2d82e8;
  --green: #1a9e5c;
  --green-bg: rgba(26,158,92,0.10);
  --red: #d93a55;
  --red-bg: rgba(217,58,85,0.10);
  --yellow: #c47f00;
  --yellow-bg: rgba(196,127,0,0.10);
  --blue: #1a6fd4;
  --blue-bg: rgba(26,111,212,0.10);
  --radius: 6px;
  --font: 'IBM Plex Sans', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}

/* LOGIN */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:32px;padding:20px}
.login-logo{text-align:center}
.login-logo .drop{font-size:40px;margin-bottom:12px;filter:drop-shadow(0 0 16px rgba(26,111,212,0.25))}
.login-logo h1{font-size:22px;font-weight:600;letter-spacing:-0.5px}
.login-logo p{font-size:13px;color:var(--text2);margin-top:4px;font-family:var(--mono)}
.login-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:28px 32px;cursor:pointer;text-align:center;transition:all .2s;min-width:180px;position:relative;overflow:hidden}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .2s}
.login-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.login-card:hover::before{transform:scaleX(1)}
.login-card .ic{font-size:32px;margin-bottom:12px}
.login-card h3{font-size:15px;font-weight:600;margin-bottom:6px}
.login-card p{font-size:12px;color:var(--text2);line-height:1.6}
#loginStatus{font-size:12px;color:var(--text2);font-family:var(--mono)}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:50}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{font-size:18px}
.header h2{font-size:15px;font-weight:600;letter-spacing:-0.3px}
.badge{font-size:11px;padding:2px 10px;border-radius:100px;font-family:var(--mono);font-weight:500}
.badge.ing{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(77,159,255,0.2)}
.badge.pan{background:var(--green-bg);color:var(--green);border:1px solid rgba(45,202,115,0.2)}
.header-right{display:flex;gap:8px;align-items:center}
.hbtn{height:30px;padding:0 12px;border-radius:var(--radius);font-size:12px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:var(--font);transition:all .15s}
.hbtn:hover{border-color:var(--border2);color:var(--text)}
.hbtn.sync{color:var(--blue);border-color:rgba(77,159,255,0.3)}
.hbtn.sync:hover{background:var(--blue-bg)}

/* TABS */
.tabs{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 20px}
.tab{padding:14px 16px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;color:var(--text2);transition:all .15s;font-weight:500}
.tab:hover:not(.active){color:var(--text)}
.tab.active{border-bottom-color:var(--accent);color:var(--accent)}

/* CONTENT */
.content{padding:20px;max-width:1200px;margin:0 auto}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}

/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.metric .val{font-size:26px;font-weight:600;font-family:var(--mono);color:var(--text)}
.metric .lbl{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.4}

/* FORMS */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11px;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:0.5px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--bg3);color:var(--text);font-family:var(--font);transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--accent)}
.fg select option{background:var(--bg3)}
.fg textarea{min-height:64px;resize:vertical}
.fg input::placeholder,.fg textarea::placeholder{color:var(--text3)}

/* BUTTONS */
.btn{height:36px;padding:0 18px;border-radius:var(--radius);font-size:13px;cursor:pointer;font-family:var(--font);font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);color:#fff;border:none}
.btn.pri:hover{background:var(--accent2)}
.btn.suc{background:var(--green-bg);color:var(--green);border:1px solid rgba(45,202,115,0.3)}
.btn.suc:hover{background:rgba(45,202,115,0.2)}
.btn.inf{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(77,159,255,0.3)}
.btn.inf:hover{background:rgba(77,159,255,0.2)}
.btn.dan{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,77,109,0.3)}
.btn.dan:hover{background:rgba(255,77,109,0.2)}
.btn.ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--border2);color:var(--text)}
.brow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}

/* ALERTS */
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.alert.suc{background:var(--green-bg);color:var(--green);border:1px solid rgba(45,202,115,0.2)}
.alert.wrn{background:var(--yellow-bg);color:var(--yellow);border:1px solid rgba(240,165,0,0.2)}
.alert.inf{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(77,159,255,0.2)}
.alert.err{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,77,109,0.2)}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;font-size:11px}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}
.obs-cell{max-width:160px;font-size:11px;color:var(--text2);white-space:normal;word-break:break-word}
.num{font-family:var(--mono);font-weight:500;color:var(--accent)}

/* STATUS */
.st{display:inline-block;font-size:11px;padding:2px 8px;border-radius:100px;font-family:var(--mono);font-weight:500}
.st.p{background:var(--yellow-bg);color:var(--yellow)}
.st.l{background:var(--green-bg);color:var(--green)}
.st.r{background:var(--blue-bg);color:var(--blue)}

/* MAIL PREVIEW */
.mail-pre{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-size:12px;white-space:pre-wrap;font-family:var(--mono);line-height:1.7;margin-top:12px;color:var(--text2)}
.mail-pre .mail-val{color:var(--text)}

/* LOADING */
.loading{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:13px;padding:40px;justify-content:center}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* STOCK COLOR */
.s-ok{color:var(--green);font-family:var(--mono);font-weight:500}
.s-low{color:var(--yellow);font-family:var(--mono);font-weight:500}
.s-zero{color:var(--red);font-family:var(--mono);font-weight:500}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:18px 0}

a.btn{text-decoration:none}
</style>
</head>
<body>

<div id="app">
  <!-- LOGIN -->
  <div class="login-wrap" id="loginScreen">
    <div class="login-logo">
      <div class="drop">🛢</div>
      <h1>Stock de Aceites</h1>
      <p>Ecominera — Sistema de control</p>
    </div>
    <div class="login-cards">
      <div class="login-card" onclick="login('ingeniero')">
        <div class="ic">⚙️</div>
        <h3>Ingeniero</h3>
        <p>Acceso completo<br>Pedidos · Stock · Mail</p>
      </div>
      <div class="login-card" onclick="login('pañolero')">
        <div class="ic">📋</div>
        <h3>Pañolero</h3>
        <p>Solicitudes · Llegados<br>Consumos</p>
      </div>
    </div>
    <div id="loginStatus"></div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" style="display:none">
    <div class="header">
      <div class="header-left">
        <span class="header-logo">🛢</span>
        <h2>Stock de Aceites</h2>
        <span class="badge" id="userBadge"></span>
      </div>
      <div class="header-right">
        <button class="hbtn sync" onclick="sincronizar()">↺ Sincronizar</button>
        <button class="hbtn" onclick="logout()">Salir</button>
      </div>
    </div>
    <div class="tabs" id="tabsRow"></div>
    <div class="content" id="mainContent"></div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzxGQPTISzojlc3CKDMzN8pigTW__j2U0",
  authDomain: "stock-aceites-9ca0f.firebaseapp.com",
  projectId: "stock-aceites-9ca0f",
  storageBucket: "stock-aceites-9ca0f.firebasestorage.app",
  messagingSenderId: "174224345409",
  appId: "1:174224345409:web:d2e9df7dc12fc8e2b339c0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ACEITES = [
  "15W40 MOTOR","10W40 MOTOR","10W30 MOTOR","10W30 TRX (UTTO)",
  "80W90 TRX HIPOIDAL","85W140","75W80","80W","SAE 30 TRX",
  "SAE 30 CONVERTIDOR","SAE 50","SUPER 50","SUPER 10W","FT SUPER 30",
  "HIDRAULICO BP 68 (YPF)","HIDRAULICO BP 46 (YPF)","HIDRAULICO TELLUS S2V68",
  "HIDRAULICO 10W","TELLUS 32V HIDRAULICO","TELLUS AIR TOOL S2A",
  "TRASMISION SPIRAX S4 CX 30","ATF","BP 32","CORENA S4 R 32 COMPRESOR",
  "AZOLLA ZS 32 COMPRESOR","REFRIGERANTE RED","REFRIGERANTE GREEN",
  "PARAFLU RED ANTICONGELANTE","ANTICONGELANTE HEAVY DUTY TIPO A",
  "GRASA V220","10W","TELLUS S2 M 32","TELLUS S2 M 68"
];

const STOCK_INICIAL = {
  "15W40 MOTOR":155,"10W40 MOTOR":200,"10W30 MOTOR":580,"10W30 TRX (UTTO)":205,
  "80W90 TRX HIPOIDAL":730,"85W140":480,"75W80":220,"80W":100,"SAE 30 TRX":65,
  "SAE 30 CONVERTIDOR":100,"SAE 50":20,"SUPER 50":600,"SUPER 10W":0,
  "FT SUPER 30":200,"HIDRAULICO BP 68 (YPF)":975,"HIDRAULICO BP 46 (YPF)":0,
  "HIDRAULICO TELLUS S2V68":0,"HIDRAULICO 10W":0,"TELLUS 32V HIDRAULICO":260,
  "TELLUS AIR TOOL S2A":400,"TRASMISION SPIRAX S4 CX 30":0,"ATF":303,
  "BP 32":1040,"CORENA S4 R 32 COMPRESOR":5,"AZOLLA ZS 32 COMPRESOR":0,
  "REFRIGERANTE RED":70,"REFRIGERANTE GREEN":30,"PARAFLU RED ANTICONGELANTE":275,
  "ANTICONGELANTE HEAVY DUTY TIPO A":300,"GRASA V220":200,"10W":400,
  "TELLUS S2 M 32":200,"TELLUS S2 M 68":200
};

let S = { user:null, tab:0, pedidos:[], consumos:[], stock:{}, counter:27 };

// ── FIREBASE HELPERS ──────────────────────────────────────
async function fbGet(docId) {
  try {
    const snap = await getDoc(doc(db, "aceites", docId));
    return snap.exists() ? snap.data().value : null;
  } catch(e) { return null; }
}
async function fbSet(docId, value) {
  try {
    await setDoc(doc(db, "aceites", docId), { value });
  } catch(e) { console.error(e); }
}

async function cargarDatos() {
  const [p, c, sk, n] = await Promise.all([
    fbGet('pedidos'), fbGet('consumos'), fbGet('stock'), fbGet('counter')
  ]);
  S.pedidos  = p  || [];
  S.consumos = c  || [];
  S.stock    = sk || JSON.parse(JSON.stringify(STOCK_INICIAL));
  S.counter  = n  || 27;
}

async function guardarDatos() {
  await Promise.all([
    fbSet('pedidos',  S.pedidos),
    fbSet('consumos', S.consumos),
    fbSet('stock',    S.stock),
    fbSet('counter',  S.counter)
  ]);
}

// ── AUTH ──────────────────────────────────────────────────
window.login = async function(u) {
  document.getElementById('loginStatus').innerHTML = '<div style="display:flex;align-items:center;gap:8px"><div class="spinner"></div> Cargando datos...</div>';
  await cargarDatos();
  S.user = u;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  const b = document.getElementById('userBadge');
  b.textContent = u === 'ingeniero' ? 'Ingeniero' : 'Pañolero';
  b.className = 'badge ' + (u === 'ingeniero' ? 'ing' : 'pan');
  buildTabs();
  renderTab(0);
};

window.logout = function() {
  S.user = null;
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('loginStatus').innerHTML = '';
};

window.sincronizar = async function() {
  const btn = document.querySelector('.hbtn.sync');
  if(btn) btn.textContent = '↺ Cargando...';
  await cargarDatos();
  renderTab(S.tab);
  if(btn) btn.textContent = '↺ Sincronizar';
};

// ── TABS ──────────────────────────────────────────────────
function buildTabs() {
  const tabs = S.user === 'ingeniero'
    ? ['Resumen','Pedidos pendientes','Nuevo pedido','Consumos','Stock']
    : ['Resumen','Pedidos pendientes','Solicitudes / Llegados','Consumos','Stock'];
  document.getElementById('tabsRow').innerHTML = tabs.map((t,i) =>
    `<div class="tab${i===0?' active':''}" onclick="renderTab(${i})">${t}</div>`
  ).join('');
}

function setTab(i) {
  document.querySelectorAll('.tab').forEach((t,j) => t.classList.toggle('active', j===i));
}

window.renderTab = function(i) {
  S.tab = i; setTab(i);
  const c = document.getElementById('mainContent');
  const tabs = S.user === 'ingeniero'
    ? [renderResumen, renderPedidosPendientes, renderNuevoPedido, renderConsumos, renderStock]
    : [renderResumen, renderPedidosPendientes, renderSolicitudes, renderConsumos, renderStock];
  c.innerHTML = tabs[i]();
};

// ── UTILS ─────────────────────────────────────────────────
function fmt(d) {
  if(!d) return '-';
  try { return new Date(d+'T12:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
  catch(e) { return d; }
}
function nextNum() { return 'PF' + String(S.counter).padStart(2,'0'); }
function fv(id) { return document.getElementById(id)?.value || ''; }

// ── RESUMEN ───────────────────────────────────────────────
function renderResumen() {
  const pend   = S.pedidos.filter(p=>p.estado==='PENDIENTE').length;
  const conSC  = S.pedidos.filter(p=>p.nroSolicitud&&p.estado==='PENDIENTE').length;
  const sinSC  = S.pedidos.filter(p=>!p.nroSolicitud&&p.estado==='PENDIENTE').length;
  const llegados = S.pedidos.filter(p=>p.estado==='LLEGADO').length;
  const stockBajo = Object.entries(S.stock).filter(([,v])=>v<50&&v>0).length;
  const sinStock  = Object.entries(S.stock).filter(([,v])=>v===0).length;
  return `
  <div class="metrics">
    <div class="metric"><div class="val">${pend}</div><div class="lbl">Pedidos pendientes</div></div>
    <div class="metric"><div class="val">${conSC}</div><div class="lbl">Con solicitud</div></div>
    <div class="metric"><div class="val">${sinSC}</div><div class="lbl">Sin solicitud</div></div>
    <div class="metric"><div class="val">${llegados}</div><div class="lbl">Llegados</div></div>
    <div class="metric"><div class="val">${S.consumos.length}</div><div class="lbl">Consumos totales</div></div>
  </div>
  ${sinSC>0?`<div class="alert wrn">⚠ ${sinSC} pedido${sinSC>1?'s':''} sin solicitud de compra cargada</div>`:''}
  ${stockBajo>0?`<div class="alert wrn">⚠ ${stockBajo} aceite${stockBajo>1?'s':''} con stock bajo (menos de 50L)</div>`:''}
  ${sinStock>0?`<div class="alert err">✕ ${sinStock} aceite${sinStock>1?'s':''} sin stock</div>`:''}
  <div class="card">
    <div class="card-title">Últimos consumos</div>
    <div class="tw"><table>
      <tr><th>Fecha</th><th>Aceite</th><th>Cant (L)</th><th>Equipo</th><th>Interno</th><th>Trabajador</th></tr>
      ${S.consumos.slice(-8).reverse().map(c=>`
        <tr><td>${fmt(c.fecha)}</td><td>${c.aceite}</td><td class="num">${c.cantidad}</td><td>${c.equipo||'-'}</td><td>${c.interno||'-'}</td><td>${c.trabajador||'-'}</td></tr>
      `).join('')||'<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text3)">Sin consumos registrados</td></tr>'}
    </table></div>
  </div>`;
}

// ── PEDIDOS PENDIENTES ────────────────────────────────────
function renderPedidosPendientes() {
  return `
  <div class="card">
    <div class="card-title">Todos los pedidos</div>
    <div class="tw"><table>
      <tr><th>N°</th><th>Fecha</th><th>Aceite</th><th>Cant (L)</th><th>Equipo</th><th>Interno</th><th>Estado</th><th>N° Solicitud</th><th>Observaciones</th>${S.user==='ingeniero'?'<th></th>':''}</tr>
      ${S.pedidos.length===0?`<tr><td colspan="10" style="text-align:center;padding:24px;color:var(--text3)">Sin pedidos cargados</td></tr>`:''}
      ${S.pedidos.map((p,i)=>`
        <tr>
          <td class="num">${p.numero}</td>
          <td>${fmt(p.fecha)}</td>
          <td>${p.aceite}</td>
          <td class="num">${p.cantidad}</td>
          <td>${p.equipo}</td>
          <td>${p.interno}</td>
          <td><span class="st ${p.estado==='PENDIENTE'?'p':'l'}">${p.estado}</span></td>
          <td>${p.nroSolicitud||'<span style="color:var(--text3);font-size:11px">Sin cargar</span>'}</td>
          <td class="obs-cell">${p.observaciones||'-'}</td>
          ${S.user==='ingeniero'?`<td><button class="btn dan" style="height:28px;font-size:11px;padding:0 10px" onclick="borrarPedido(${i})">✕</button></td>`:''}
        </tr>
      `).join('')}
    </table></div>
  </div>`;
}

// ── NUEVO PEDIDO (INGENIERO) ──────────────────────────────
function renderNuevoPedido() {
  const hoy = new Date().toISOString().split('T')[0];
  return `
  <div class="card">
    <div class="card-title">Nuevo pedido — <span style="color:var(--accent);font-family:var(--mono)">${nextNum()}</span></div>
    <div class="fgrid">
      <div class="fg"><label>Fecha</label><input type="date" id="np_fecha" value="${hoy}"></div>
      <div class="fg"><label>Tipo de aceite</label>
        <select id="np_aceite"><option value="">Seleccionar...</option>${ACEITES.map(a=>`<option>${a}</option>`).join('')}</select>
      </div>
      <div class="fg"><label>Cantidad (litros)</label><input type="number" id="np_cant" placeholder="205" min="1"></div>
      <div class="fg"><label>Equipo destino</label><input type="text" id="np_equipo" placeholder="DD321"></div>
      <div class="fg"><label>Nro interno</label><input type="text" id="np_interno" placeholder="1106"></div>
      <div class="fg"><label>Marca equipo</label><input type="text" id="np_marca" placeholder="SANDVIK"></div>
      <div class="fg"><label>Modelo equipo</label><input type="text" id="np_modelo" placeholder="DD321"></div>
    </div>
    <div class="fg" style="margin-top:12px"><label>Observaciones</label>
      <textarea id="np_obs" placeholder="Urgencia, contacto, notas adicionales..."></textarea>
    </div>
    <div class="brow">
      <button class="btn pri" onclick="guardarPedido()">Guardar pedido</button>
      <button class="btn inf" onclick="previewMail()">Generar mail Outlook</button>
    </div>
    <div id="saveMsg"></div>
    <div id="mailArea"></div>
  </div>`;
}

window.guardarPedido = async function() {
  if(!fv('np_aceite')||!fv('np_cant')||!fv('np_equipo')||!fv('np_interno')) {
    alert('Completá: aceite, cantidad, equipo e interno'); return;
  }
  const num = nextNum();
  S.pedidos.push({
    numero:num, fecha:fv('np_fecha'), aceite:fv('np_aceite'),
    cantidad:parseInt(fv('np_cant')), equipo:fv('np_equipo'),
    interno:fv('np_interno'), marca:fv('np_marca'), modelo:fv('np_modelo'),
    observaciones:fv('np_obs'), estado:'PENDIENTE', nroSolicitud:''
  });
  S.counter++;
  const msg = document.getElementById('saveMsg');
  if(msg) msg.innerHTML = '<div class="alert inf" style="margin-top:10px"><div class="spinner"></div> Guardando...</div>';
  await guardarDatos();
  if(msg) msg.innerHTML = `<div class="alert suc" style="margin-top:10px">✓ Pedido ${num} guardado y sincronizado en ambas computadoras</div>`;
  setTimeout(()=>renderTab(2), 1500);
};

window.previewMail = function() {
  if(!fv('np_aceite')||!fv('np_cant')||!fv('np_equipo')||!fv('np_interno')) {
    alert('Completá los campos para generar el mail'); return;
  }
  const num = nextNum();
  const fechaStr = fv('np_fecha') ? new Date(fv('np_fecha')+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'}) : '-';
  const obs = fv('np_obs');
  const bodyTxt =
`Buen día Jorge,

Favor avanzar con solicitud de Fluidos,

FECHA PEDIDO\tTIPO DE ACEITE\tCANTIDAD\tEQUIPO\tINTERNO\tPEDIDO N°
${fechaStr}\t${fv('np_aceite')}\t${fv('np_cant')}\t${fv('np_equipo')}\t${fv('np_interno')}\t${num}

Saludos,${obs?'\n\nObs: '+obs:''}`;

  const to  = 'jorgesteiner@ecominera.com.ar';
  const cc  = 'guillermocorrea@ecominera.com.ar;alejandrofernandez@ecominera.com.ar;PASANTECRE@ecominera.com.ar;danielfernandez@ecominera.com.ar';
  const subj = encodeURIComponent(`Solicitud de Fluidos - ${num} - ${fv('np_aceite')}`);
  const link = `mailto:${to}?cc=${encodeURIComponent(cc)}&subject=${subj}&body=${encodeURIComponent(bodyTxt)}`;

  document.getElementById('mailArea').innerHTML = `
    <div class="divider"></div>
    <div class="alert suc">✓ Mail listo — hacé clic en "Abrir en Outlook" para enviarlo</div>
    <div class="mail-pre">Para: <span class="mail-val">jorgesteiner@ecominera.com.ar</span>
CC: <span class="mail-val">guillermocorrea@ecominera.com.ar; alejandrofernandez@ecominera.com.ar; PASANTECRE@ecominera.com.ar; danielfernandez@ecominera.com.ar</span>
Asunto: <span class="mail-val">Solicitud de Fluidos - ${num} - ${fv('np_aceite')}</span>

Buen día Jorge,

Favor avanzar con solicitud de Fluidos,

FECHA         TIPO DE ACEITE                       CANT    EQUIPO    INTERNO   PEDIDO N°
<span class="mail-val">${fechaStr.padEnd(14)}${fv('np_aceite').padEnd(37)}${fv('np_cant').padEnd(8)}${fv('np_equipo').padEnd(10)}${fv('np_interno').padEnd(10)}${num}</span>

Saludos,${obs?'\n\nObs: '+obs:''}</div>
    <div class="brow"><a href="${link}" class="btn pri">Abrir en Outlook</a></div>`;
};

window.borrarPedido = async function(i) {
  if(confirm('¿Eliminar este pedido?')) {
    S.pedidos.splice(i,1);
    await guardarDatos();
    renderTab(1);
  }
};

// ── SOLICITUDES / LLEGADOS (PAÑOLERO) ────────────────────
function renderSolicitudes() {
  const sinSC    = S.pedidos.filter(p=>p.estado==='PENDIENTE'&&!p.nroSolicitud);
  const conSC    = S.pedidos.filter(p=>p.estado==='PENDIENTE'&&p.nroSolicitud);
  const sinLlegar= S.pedidos.filter(p=>p.estado==='PENDIENTE');
  return `
  <div class="card">
    <div class="card-title">Cargar número de solicitud de compra</div>
    ${sinSC.length===0?'<div class="alert suc">✓ Todos los pedidos pendientes tienen solicitud cargada</div>':''}
    <div class="fgrid">
      <div class="fg"><label>Pedido pendiente</label>
        <select id="sol_ped" onchange="mostrarDetSol()">
          <option value="">Seleccionar...</option>
          ${sinSC.map(p=>`<option value="${p.numero}">${p.numero} — ${p.aceite} — Int. ${p.interno}</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label>Nro solicitud de compra</label><input type="text" id="sol_num" placeholder="SC-12345"></div>
    </div>
    <div id="sol_det" style="font-size:12px;color:var(--text2);margin-top:8px;min-height:18px"></div>
    <div class="brow"><button class="btn pri" onclick="guardarSolicitud()">Guardar solicitud</button></div>
    <div id="sol_msg"></div>
  </div>

  <div class="card">
    <div class="card-title">Marcar pedido llegado — actualizar stock</div>
    <div class="fgrid">
      <div class="fg"><label>Pedido que llegó</label>
        <select id="ll_ped">
          <option value="">Seleccionar...</option>
          ${sinLlegar.map(p=>`<option value="${p.numero}">${p.numero} — ${p.aceite} (${p.cantidad}L)${p.nroSolicitud?' · SC:'+p.nroSolicitud:''}</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label>Cantidad recibida (litros)</label><input type="number" id="ll_cant" placeholder="Confirmá cantidad" min="1"></div>
    </div>
    <div class="brow"><button class="btn suc" onclick="marcarLlegado()">✓ Marcar llegado y actualizar stock</button></div>
    <div id="ll_msg"></div>
  </div>

  ${conSC.length>0?`
  <div class="card">
    <div class="card-title">Pedidos con solicitud — esperando llegada</div>
    <div class="tw"><table>
      <tr><th>N°</th><th>Aceite</th><th>Cant (L)</th><th>Equipo</th><th>Interno</th><th>N° Solicitud</th><th>Observaciones</th></tr>
      ${conSC.map(p=>`
        <tr><td class="num">${p.numero}</td><td>${p.aceite}</td><td class="num">${p.cantidad}</td><td>${p.equipo}</td><td>${p.interno}</td><td class="num">${p.nroSolicitud}</td><td class="obs-cell">${p.observaciones||'-'}</td></tr>
      `).join('')}
    </table></div>
  </div>`:''}`;
}

window.mostrarDetSol = function() {
  const p = S.pedidos.find(x=>x.numero===fv('sol_ped'));
  document.getElementById('sol_det').innerHTML = p
    ? `<b>${p.aceite}</b> — ${p.cantidad}L — Equipo: ${p.equipo} / Interno: ${p.interno}${p.observaciones?' — <i>'+p.observaciones+'</i>':''}`
    : '';
};

window.guardarSolicitud = async function() {
  const num = fv('sol_ped'), sc = fv('sol_num').trim();
  if(!num||!sc) { alert('Seleccioná el pedido e ingresá el nro de solicitud'); return; }
  const idx = S.pedidos.findIndex(p=>p.numero===num);
  if(idx>=0) S.pedidos[idx].nroSolicitud = sc;
  const msg = document.getElementById('sol_msg');
  if(msg) msg.innerHTML = '<div class="alert inf" style="margin-top:10px"><div class="spinner"></div> Guardando...</div>';
  await guardarDatos();
  if(msg) msg.innerHTML = `<div class="alert suc" style="margin-top:10px">✓ Solicitud ${sc} cargada al pedido ${num}</div>`;
  setTimeout(()=>renderTab(2), 1200);
};

window.marcarLlegado = async function() {
  const num = fv('ll_ped'), cant = parseInt(fv('ll_cant'));
  if(!num||!cant) { alert('Seleccioná el pedido e ingresá la cantidad recibida'); return; }
  const idx = S.pedidos.findIndex(p=>p.numero===num);
  if(idx>=0) {
    const p = S.pedidos[idx];
    p.estado = 'LLEGADO'; p.cantRecibida = cant;
    S.stock[p.aceite] = (S.stock[p.aceite]||0) + cant;
    const msg = document.getElementById('ll_msg');
    if(msg) msg.innerHTML = '<div class="alert inf" style="margin-top:10px"><div class="spinner"></div> Actualizando stock...</div>';
    await guardarDatos();
    if(msg) msg.innerHTML = `<div class="alert suc" style="margin-top:10px">✓ Stock actualizado: ${p.aceite} +${cant}L</div>`;
    setTimeout(()=>renderTab(2), 1200);
  }
};

// ── CONSUMOS ──────────────────────────────────────────────
function renderConsumos() {
  const hoy = new Date().toISOString().split('T')[0];
  return `
  <div class="card">
    <div class="card-title">Registrar consumo</div>
    <div class="fgrid3">
      <div class="fg"><label>Fecha</label><input type="date" id="cn_fecha" value="${hoy}"></div>
      <div class="fg"><label>Tipo de aceite</label>
        <select id="cn_aceite"><option value="">Seleccionar...</option>${ACEITES.map(a=>`<option>${a}</option>`).join('')}</select>
      </div>
      <div class="fg"><label>Cantidad (litros)</label><input type="number" id="cn_cant" placeholder="50" min="1"></div>
      <div class="fg"><label>Equipo / Destino</label><input type="text" id="cn_equipo" placeholder="DD321"></div>
      <div class="fg"><label>Nro interno</label><input type="text" id="cn_interno" placeholder="1106"></div>
      <div class="fg"><label>Nombre trabajador</label><input type="text" id="cn_trab" placeholder="Apellido Nombre"></div>
    </div>
    <div class="fg" style="margin-top:12px"><label>Observaciones</label>
      <textarea id="cn_obs" placeholder="Observaciones del consumo..."></textarea>
    </div>
    <div class="brow"><button class="btn pri" onclick="guardarConsumo()">Registrar consumo</button></div>
    <div id="cn_msg"></div>
  </div>
  <div class="card">
    <div class="card-title">Historial de consumos</div>
    <div class="tw"><table>
      <tr><th>Fecha</th><th>Aceite</th><th>Cant (L)</th><th>Equipo</th><th>Interno</th><th>Trabajador</th><th>Obs.</th></tr>
      ${S.consumos.length===0?`<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text3)">Sin consumos registrados</td></tr>`:''}
      ${S.consumos.slice().reverse().map(c=>`
        <tr><td>${fmt(c.fecha)}</td><td>${c.aceite}</td><td class="num">${c.cantidad}</td><td>${c.equipo||'-'}</td><td>${c.interno||'-'}</td><td>${c.trabajador||'-'}</td><td class="obs-cell">${c.observaciones||'-'}</td></tr>
      `).join('')}
    </table></div>
  </div>`;
}

window.guardarConsumo = async function() {
  if(!fv('cn_aceite')||!fv('cn_cant')) { alert('Seleccioná el aceite y la cantidad'); return; }
  const cant = parseInt(fv('cn_cant')), aceite = fv('cn_aceite');
  const stockAct = S.stock[aceite]||0;
  if(cant>stockAct && !confirm(`Stock disponible de ${aceite}: ${stockAct}L. ¿Registrar igualmente?`)) return;
  S.consumos.push({
    fecha:fv('cn_fecha'), aceite, cantidad:cant,
    equipo:fv('cn_equipo'), interno:fv('cn_interno'),
    trabajador:fv('cn_trab'), observaciones:fv('cn_obs')
  });
  S.stock[aceite] = Math.max(0, (S.stock[aceite]||0) - cant);
  const msg = document.getElementById('cn_msg');
  if(msg) msg.innerHTML = '<div class="alert inf" style="margin-top:10px"><div class="spinner"></div> Guardando...</div>';
  await guardarDatos();
  if(msg) msg.innerHTML = '<div class="alert suc" style="margin-top:10px">✓ Consumo registrado. Stock actualizado.</div>';
  setTimeout(()=>renderTab(3), 1200);
};

// ── STOCK ─────────────────────────────────────────────────
function renderStock() {
  const entries = Object.entries(S.stock).sort((a,b)=>a[0].localeCompare(b[0]));
  return `
  <div class="card">
    <div class="card-title">
      <span>Stock actual (litros)</span>
      ${S.user==='ingeniero'?`<button class="btn ghost" style="height:28px;font-size:12px" onclick="mostrarAjuste()">Ajuste manual</button>`:''}
    </div>
    <div id="ajuste_form"></div>
    <div class="tw"><table>
      <tr><th>Tipo de aceite</th><th>Stock (L)</th><th>Estado</th></tr>
      ${entries.map(([k,v])=>`
        <tr>
          <td>${k}</td>
          <td class="${v===0?'s-zero':v<50?'s-low':'s-ok'}">${v}</td>
          <td>${v===0?'<span class="st p">Sin stock</span>':v<50?'<span class="st p">Stock bajo</span>':'<span class="st l">OK</span>'}</td>
        </tr>
      `).join('')}
    </table></div>
  </div>`;
}

window.mostrarAjuste = function() {
  document.getElementById('ajuste_form').innerHTML = `
    <div style="background:var(--bg3);padding:14px;border-radius:var(--radius);margin-bottom:16px;border:1px solid var(--border)">
      <div class="fgrid" style="margin-bottom:12px">
        <div class="fg"><label>Tipo de aceite</label>
          <select id="adj_aceite"><option value="">Seleccionar...</option>${ACEITES.map(a=>`<option>${a}</option>`).join('')}</select>
        </div>
        <div class="fg"><label>Nuevo stock (litros)</label><input type="number" id="adj_val" min="0" placeholder="0"></div>
      </div>
      <div class="brow">
        <button class="btn pri" onclick="confirmarAjuste()">Confirmar ajuste</button>
        <button class="btn ghost" onclick="document.getElementById('ajuste_form').innerHTML=''">Cancelar</button>
      </div>
    </div>`;
};

window.confirmarAjuste = async function() {
  const aceite = fv('adj_aceite'), val = parseInt(fv('adj_val'));
  if(!aceite||isNaN(val)) { alert('Completá los campos'); return; }
  S.stock[aceite] = val;
  await guardarDatos();
  alert(`✓ Stock de ${aceite} ajustado a ${val}L`);
  renderTab(4);
};

</script>
</body>
</html>
